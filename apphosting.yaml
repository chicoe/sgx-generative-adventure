# Firebase App Hosting config (Node buildpack — no custom adapter needed).
# Secrets are stored in Cloud Secret Manager; set them with:
#   firebase apphosting:secrets:set GEMINI_API_KEY
# Non-secret values can be edited inline below.
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # Public client config — exposed to the browser bundle (PUBLIC_ prefix).
  - variable: PUBLIC_FIREBASE_CONFIG
    value: '{"projectId":"sgx-generative-adventure","appId":"1:75815622349:web:c44f999ec4d0e4c630fb84","storageBucket":"sgx-generative-adventure.firebasestorage.app","apiKey":"AIzaSyBs3QmAv0cmZZsTDSjt8V0W8E3eYkQSvwI","authDomain":"sgx-generative-adventure.firebaseapp.com","messagingSenderId":"75815622349","measurementId":"G-VJM8HXB6FL","projectNumber":"75815622349","version":"2"}'
    availability:
      - BUILD
      - RUNTIME

  - variable: GEMINI_MODEL
    value: gemini-2.5-flash-lite
    availability:
      - RUNTIME

  - variable: EDITOR_ALLOWED_EMAILS
    value: 'francisco@incomputable.io,test@incomputable.io'
    availability:
      - RUNTIME

  # Server-only secret; never exposed to the client.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
